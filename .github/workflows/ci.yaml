name: CI/CD Pipeline Investigation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ============================================================
  # TASK 1.1 — THE GREEN BUILD THAT LIES
  # ============================================================
  # The application compiles successfully, but does it work?
  #
  # Your mission:
  #   1. Add a functional test after compilation.
  #   2. Run the application with the required inputs.
  #   3. Compare its output with the expected result.
  #   4. Investigate and fix any unexpected behavior.
  #
  # Instructions: docs/task1-1.md
  # ============================================================

  task1-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile C application
        run: gcc expo/expo.c -lm -o sdo-expo

      - name: Run application test
        run: |
          output=$(./sdo-expo 2 10)
          echo "Output: $output"
          test "$output" = "2 ^ 10 = 1024"

      - name: Run an example program
        run: ./sdo-expo 2 10

      # TASK 1.1: Add your functional test step here.

  # ============================================================
  # TASK 1.2 — THE UNPROTECTED DOCKER BUILD
  # ============================================================
  # A successful test should be required before building Docker.
  # A successful image build does not guarantee it can run.
  #
  # Your mission:
  #   1. Make this job depend on the test job.
  #   2. Confirm it is skipped when the test fails.
  #   3. Run the built Docker image with test arguments.
  #   4. Verify its output and investigate runtime failures.
  #
  # Instructions: docs/task1-2.md
  # ============================================================

  task1-docker-build:
    needs: task1-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./expo
          load: true
          tags: sdo-expo:1.0

      - name: Run container test
        run: |
          output=$(docker run --rm sdo-expo:1.0 2 10)
          echo "Container output: $output"
          test "$output" = "2 ^ 10 = 1024"

      # TASK 1.2: Add a step to run and verify the container.

  # ============================================================
  # TASK 2 — WEBSITE INVESTIGATION
  # Independent job, same workflow; both investigations run on push.
  # ============================================================
  task2-website:
    # TASK 2.1–2.3: Investigate the website in the same CI pipeline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TASK 2.1 — BUILD THE WEBSITE
      # Confirm that the C server compiles, then build its Docker image.
      # Case file: docs/task2-1.md
      - name: Compile web server
        run: gcc -Wall -Wextra -o /tmp/sdo-server website/server.c

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./website
          load: true
          tags: sdo-web:1.0

      # TASK 2.3 — RELIABLE CI AND DEBUGGING
      # Add a readiness retry loop and best-effort failure diagnostics.
      # Case file: docs/task2-3.md
      # Replace any fixed startup sleep with readiness checks.
      # Add an if: failure() diagnostic step at the END of this job.
